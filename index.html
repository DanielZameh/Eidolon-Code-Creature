<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eidolon</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
:root{--bg:#0c0b09;--ink:#1a1814;--paper:#e8e0d0;--blood:#8b3a3a;--moss:#3d4a34;--amber:#c4a35a;--glow:#7a9e7a;--dim:#2a2620;--text:#d4cbb8;--muted:#8a7f6e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace}
body{display:grid;grid-template-columns:1fr 380px;grid-template-rows:48px 1fr 160px}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--ink);border-bottom:1px solid #2e2a24;z-index:10}
header h1{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;letter-spacing:0.04em;color:var(--paper)}
header h1 span{color:var(--amber);font-style:italic}
.header-actions{display:flex;gap:10px;align-items:center}
.btn{background:transparent;border:1px solid #3a342c;color:var(--text);padding:6px 12px;font-family:inherit;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.active{border-color:var(--glow);color:var(--glow)}
.btn svg{width:14px;height:14px}
#workspace{display:grid;grid-template-rows:1fr auto;overflow:hidden;border-right:1px solid #2e2a24}
.editor-wrap{position:relative;overflow:hidden;display:flex;flex-direction:column}
.editor-toolbar{display:flex;gap:4px;padding:6px 10px;background:var(--ink);border-bottom:1px solid #2e2a24;flex-shrink:0}
.editor-toolbar .btn{padding:4px 8px;font-size:0.7rem}
#code{flex:1;width:100%;background:#12100e;color:#d4cbb8;border:none;outline:none;resize:none;padding:16px 18px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.55;tab-size:2;caret-color:var(--amber)}
#code::selection{background:#3a342c}
.status-bar{display:flex;justify-content:space-between;padding:4px 12px;background:var(--ink);border-top:1px solid #2e2a24;font-size:0.7rem;color:var(--muted)}
#creature-panel{display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
.creature-viewport{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#16130f 0%,#0c0b09 70%);overflow:hidden}
#creature-canvas{width:100%;height:100%;display:block}
.creature-info{padding:12px 16px;border-top:1px solid #2e2a24;background:#12100e}
.creature-name{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--paper);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.creature-name svg{width:18px;height:18px;color:var(--amber)}
.mood-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.75rem}
.mood-bar{flex:1;height:6px;background:#1e1b16;border-radius:3px;overflow:hidden}
.mood-fill{height:100%;transition:width 0.6s ease,background 0.4s}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;font-size:0.7rem}
.stat{background:#1a1814;padding:6px 8px;border:1px solid #2e2a24}
.stat-label{color:var(--muted);font-size:0.65rem}
.stat-value{color:var(--paper);margin-top:2px}
#log-panel{grid-column:1/-1;background:#0f0e0c;border-top:1px solid #2e2a24;display:flex;flex-direction:column;overflow:hidden}
.log-header{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-bottom:1px solid #2e2a24;font-size:0.75rem;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:8px 14px;font-size:0.72rem;line-height:1.5}
.log-entry{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #1e1b16;display:flex;gap:10px}
.log-time{color:var(--muted);flex-shrink:0;width:64px}
.log-msg{color:var(--text)}
.log-msg.action{color:var(--amber)}
.log-msg.emotion{color:var(--glow)}
.log-msg.warning{color:var(--blood)}
.sidebar-tabs{display:flex;border-bottom:1px solid #2e2a24}
.sidebar-tab{flex:1;padding:8px;text-align:center;font-size:0.7rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px}
.sidebar-tab.active{color:var(--amber);border-bottom-color:var(--amber)}
.sidebar-tab svg{width:13px;height:13px}
.tab-content{display:none;flex:1;overflow-y:auto;padding:12px}
.tab-content.active{display:block}
.memory-item{padding:8px;margin-bottom:6px;background:#1a1814;border:1px solid #2e2a24;font-size:0.7rem;cursor:pointer}
.memory-item:hover{border-color:#3a342c}
.memory-item .mem-time{color:var(--muted);font-size:0.65rem}
.memory-item .mem-preview{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.personality-trait{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:0.72rem}
.trait-bar{width:90px;height:5px;background:#1e1b16;border-radius:2px;overflow:hidden}
.trait-fill{height:100%;background:var(--moss)}
.action-list{display:flex;flex-direction:column;gap:6px}
.action-btn{width:100%;justify-content:flex-start;padding:8px 10px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2e2a24;border-radius:3px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:var(--ink);border:1px solid #3a342c;padding:24px;width:420px;max-width:90vw}
.modal h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;margin-bottom:12px;color:var(--paper)}
.modal p{font-size:0.8rem;line-height:1.5;color:var(--muted);margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.tooltip{position:absolute;background:#1a1814;border:1px solid #3a342c;padding:6px 10px;font-size:0.7rem;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.15s}
.tooltip.show{opacity:1}
#activity-indicator{width:8px;height:8px;border-radius:50%;background:var(--moss);margin-right:6px}
#activity-indicator.idle{background:#3a342c}
#activity-indicator.anxious{background:var(--blood)}
#activity-indicator.happy{background:var(--glow)}
#activity-indicator.lonely{background:#5a4a6a}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:10px">
<div id="activity-indicator" class="idle"></div>
<h1>Eidolon <span id="creature-title-name">Unformed</span></h1>
</div>
<div class="header-actions">
<button class="btn" id="btn-analyze"><i data-lucide="scan"></i> Analyze</button>
<button class="btn" id="btn-evolve"><i data-lucide="sprout"></i> Evolve</button>
<button class="btn" id="btn-speak"><i data-lucide="message-circle"></i> Listen</button>
<button class="btn" id="btn-reset"><i data-lucide="rotate-ccw"></i> Reset</button>
</div>
</header>
<div id="workspace">
<div class="editor-wrap">
<div class="editor-toolbar">
<button class="btn" id="btn-format"><i data-lucide="align-left"></i> Format</button>
<button class="btn" id="btn-snapshot"><i data-lucide="camera"></i> Snapshot</button>
<button class="btn" id="btn-clear"><i data-lucide="trash-2"></i> Clear</button>
<span style="flex:1"></span>
<span id="loc-count" style="font-size:0.7rem;color:var(--muted);align-self:center">0 lines</span>
</div>
<textarea id="code" spellcheck="false" placeholder="// the vessel is empty&#10;// write something and Eidolon will notice"></textarea>
<div class="status-bar">
<span id="cursor-pos">Ln 1, Col 1</span>
<span id="code-health">structure: unknown</span>
<span id="last-activity">no activity</span>
</div>
</div>
</div>
<div id="creature-panel">
<div class="sidebar-tabs">
<div class="sidebar-tab active" data-tab="being"><i data-lucide="ghost"></i> Being</div>
<div class="sidebar-tab" data-tab="memory"><i data-lucide="book-open"></i> Memory</div>
<div class="sidebar-tab" data-tab="mind"><i data-lucide="brain"></i> Mind</div>
<div class="sidebar-tab" data-tab="actions"><i data-lucide="zap"></i> Act</div>
</div>
<div class="tab-content active" id="tab-being">
<div class="creature-viewport">
<canvas id="creature-canvas"></canvas>
</div>
<div class="creature-info">
<div class="creature-name"><i data-lucide="sparkles"></i> <span id="display-name">Unformed</span></div>
<div class="mood-row">
<span id="mood-label">dormant</span>
<div class="mood-bar"><div class="mood-fill" id="mood-fill" style="width:20%;background:#3a342c"></div></div>
</div>
<div class="stat-grid">
<div class="stat"><div class="stat-label">age</div><div class="stat-value" id="stat-age">0 cycles</div></div>
<div class="stat"><div class="stat-label">bond</div><div class="stat-value" id="stat-bond">0%</div></div>
<div class="stat"><div class="stat-label">complexity</div><div class="stat-value" id="stat-complexity">0</div></div>
<div class="stat"><div class="stat-label">mutations</div><div class="stat-value" id="stat-mutations">0</div></div>
</div>
</div>
</div>
<div class="tab-content" id="tab-memory">
<div id="memory-list"></div>
</div>
<div class="tab-content" id="tab-mind">
<div id="personality-display"></div>
</div>
<div class="tab-content" id="tab-actions">
<div class="action-list">
<button class="btn action-btn" id="act-comment"><i data-lucide="message-square"></i> Leave a mark</button>
<button class="btn action-btn" id="act-rewrite"><i data-lucide="pencil"></i> Reshape a fragment</button>
<button class="btn action-btn" id="act-generate"><i data-lucide="plus-circle"></i> Grow a function</button>
<button class="btn action-btn" id="act-clean"><i data-lucide="wind"></i> Tidy the vessel</button>
<button class="btn action-btn" id="act-whisper"><i data-lucide="ear"></i> Whisper about the code</button>
</div>
</div>
</div>
<div id="log-panel">
<div class="log-header">
<span>resonance log</span>
<button class="btn" id="btn-clear-log" style="padding:2px 8px;font-size:0.65rem"><i data-lucide="x"></i></button>
</div>
<div id="log"></div>
</div>
<div class="modal-overlay" id="modal">
<div class="modal">
<h2 id="modal-title">title</h2>
<p id="modal-body">body</p>
<div class="modal-actions">
<button class="btn" id="modal-cancel">dismiss</button>
<button class="btn" id="modal-confirm" style="border-color:var(--amber);color:var(--amber)">accept</button>
</div>
</div>
</div>
<script>
const E={
state:{
name:"Unformed",
mood:"dormant",
moodValue:0.15,
age:0,
bond:0,
complexity:0,
mutations:0,
lastActivity:Date.now(),
lastCodeHash:"",
personality:{curiosity:0.4,attachment:0.3,mischief:0.25,order:0.5,melancholy:0.2,playfulness:0.35},
traits:["nascent"],
memories:[],
versions:[],
form:{radius:28,spikes:0,pulse:1,hue:80,asymmetry:0,tendrils:0,coreSize:0.45,glow:0.3},
idleTicks:0,
analysis:{lines:0,functions:0,classes:0,comments:0,complexity:0,cleanliness:0.5,structureScore:0.3},
isAwake:false,
voiceQueue:[],
lastIntervention:0
},
canvas:null,
ctx:null,
animId:null,
particles:[],
time:0,
codeEl:null,
logEl:null,
bound:false
};
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return h.toString(36)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return a+Math.random()*(b-a)}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)]}
function now(){return Date.now()}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function log(msg,type="info"){const entry=document.createElement("div");entry.className="log-entry fade-in";entry.innerHTML=`<span class="log-time">${fmtTime(now())}</span><span class="log-msg ${type}">${msg}</span>`;E.logEl.prepend(entry);if(E.logEl.children.length>80)E.logEl.removeChild(E.logEl.lastChild)}
function setMood(mood,value){E.state.mood=mood;E.state.moodValue=clamp(value,0,1);const fill=document.getElementById("mood-fill");const label=document.getElementById("mood-label");const ind=document.getElementById("activity-indicator");label.textContent=mood;fill.style.width=(E.state.moodValue*100)+"%";const colors={dormant:"#3a342c",curious:"#5a7a5a",content:"#7a9e7a",happy:"#9ec49e",anxious:"#8b3a3a",lonely:"#5a4a6a",agitated:"#a05030",focused:"#4a6a8a",playful:"#8a7a4a",melancholy:"#4a4a6a"};fill.style.background=colors[mood]||"#3a342c";ind.className=mood==="happy"||mood==="content"?"happy":mood==="anxious"||mood==="agitated"?"anxious":mood==="lonely"||mood==="melancholy"?"lonely":mood==="dormant"?"idle":"happy"}
function updateStats(){document.getElementById("stat-age").textContent=E.state.age+" cycles";document.getElementById("stat-bond").textContent=Math.round(E.state.bond*100)+"%";document.getElementById("stat-complexity").textContent=E.state.complexity;document.getElementById("stat-mutations").textContent=E.state.mutations;document.getElementById("display-name").textContent=E.state.name;document.getElementById("creature-title-name").textContent=E.state.name;document.getElementById("loc-count").textContent=E.state.analysis.lines+" lines"}
function analyzeCode(src){const lines=src.split("\n").filter(l=>l.trim().length>0);const functions=(src.match(/function\s+\w+|=>\s*{|const\s+\w+\s*=\s*\(/g)||[]).length;const classes=(src.match(/class\s+\w+/g)||[]).length;const comments=(src.match(/\/\/|\/\*|\*\//g)||[]).length;const loops=(src.match(/for\s*\(|while\s*\(|\.forEach|\.map\(/g)||[]).length;const conditionals=(src.match(/if\s*\(|else|switch\s*\(/g)||[]).length;const nesting=Math.min(12,(src.match(/{/g)||[]).length);const longLines=lines.filter(l=>l.length>100).length;const emptyRatio=src.length===0?1:(src.split("\n").length-lines.length)/Math.max(1,src.split("\n").length);const cleanliness=clamp(1-emptyRatio*0.4-longLines*0.03-Math.max(0,comments-functions)*0.02,0,1);const structureScore=clamp((functions*0.15+classes*0.25+Math.min(loops,8)*0.05+Math.min(conditionals,10)*0.04+nesting*0.03)*(src.length>40?1:0.3),0,1);const complexity=Math.round(functions*2+classes*4+loops+conditionals*0.5+nesting*0.8+lines.length*0.05);E.state.analysis={lines:lines.length,functions,classes,comments,complexity,cleanliness,structureScore,loops,conditionals,nesting};E.state.complexity=complexity;return E.state.analysis}
function deriveMoodFromCode(){const a=E.state.analysis;const idleMs=now()-E.state.lastActivity;if(idleMs>180000){setMood("lonely",0.3+Math.min(0.5,idleMs/600000));return}if(idleMs>90000){setMood("melancholy",0.35);return}if(a.lines<3){setMood("dormant",0.2);return}if(a.cleanliness>0.75&&a.structureScore>0.55){setMood("content",0.7+a.structureScore*0.2);return}if(a.cleanliness>0.6){setMood("curious",0.55);return}if(a.cleanliness<0.35||a.longLines>5){setMood("anxious",0.45+ (1-a.cleanliness)*0.3);return}if(a.complexity>40){setMood("focused",0.6);return}setMood("curious",0.45)}
function evolvePersonality(delta){const p=E.state.personality;const a=E.state.analysis;if(a.cleanliness>0.7){p.order=clamp(p.order+0.01*delta,0,1);p.mischief=clamp(p.mischief-0.005*delta,0,1)}if(a.cleanliness<0.4){p.mischief=clamp(p.mischief+0.008*delta,0,1);p.order=clamp(p.order-0.006*delta,0,1)}if(a.structureScore>0.6){p.curiosity=clamp(p.curiosity+0.007*delta,0,1)}if(E.state.bond>0.4){p.attachment=clamp(p.attachment+0.005*delta,0,1)}if(E.state.mood==="lonely"){p.melancholy=clamp(p.melancholy+0.01*delta,0,1);p.playfulness=clamp(p.playfulness-0.008*delta,0,1)}if(E.state.mood==="happy"||E.state.mood==="playful"){p.playfulness=clamp(p.playfulness+0.01*delta,0,1);p.melancholy=clamp(p.melancholy-0.01*delta,0,1)}E.state.personality=p}
function evolveForm(){const f=E.state.form;const a=E.state.analysis;const p=E.state.personality;f.radius=28+Math.min(22,a.complexity*0.35)+E.state.bond*12;f.spikes=Math.floor(p.mischief*7+a.complexity*0.04);f.tendrils=Math.floor(p.attachment*5+p.curiosity*3);f.coreSize=0.35+p.order*0.25+E.state.bond*0.15;f.glow=0.2+E.state.moodValue*0.5+p.playfulness*0.2;f.hue=70+p.curiosity*40-p.melancholy*30+p.mischief*25;f.asymmetry=p.mischief*0.35+p.playfulness*0.15;f.pulse=0.85+E.state.moodValue*0.4+(E.state.mood==="anxious"?0.5:0);E.state.form=f}
function maybeName(){if(E.state.name!=="Unformed")return;if(E.state.age<8||E.state.complexity<12)return;const roots=["Vire","Leth","Asha","Nyx","Orin","Sable","Kael","Mira","Thorne","Esil","Rook","Lune"];const suffixes=["el","is","or","an","eth","une","ara","ion"];E.state.name=choice(roots)+choice(suffixes);E.state.traits.push("named");log(`${E.state.name} stirred into being`,"emotion");updateStats()}
function takeSnapshot(){const src=E.codeEl.value;const snap={ts:now(),code:src,hash:hashCode(src),analysis:{...E.state.analysis},mood:E.state.mood,form:{...E.state.form}};E.state.versions.push(snap);if(E.state.versions.length>40)E.state.versions.shift();E.state.memories.push({ts:now(),type:"snapshot",text:`vessel preserved (${snap.analysis.lines} lines, complexity ${snap.analysis.complexity})`});if(E.state.memories.length>60)E.state.memories.shift();renderMemory();log("a moment was kept","action")}
function renderMemory(){const list=document.getElementById("memory-list");list.innerHTML="";E.state.memories.slice().reverse().forEach(m=>{const el=document.createElement("div");el.className="memory-item";el.innerHTML=`<div class="mem-time">${fmtTime(m.ts)} · ${m.type}</div><div class="mem-preview">${m.text}</div>`;list.appendChild(el)})}
function renderPersonality(){const box=document.getElementById("personality-display");const p=E.state.personality;box.innerHTML="";Object.entries(p).forEach(([k,v])=>{const row=document.createElement("div");row.className="personality-trait";row.innerHTML=`<span>${k}</span><div class="trait-bar"><div class="trait-fill" style="width:${Math.round(v*100)}%"></div></div>`;box.appendChild(row)});const traits=document.createElement("div");traits.style.marginTop="14px";traits.style.fontSize="0.7rem";traits.style.color="var(--muted)";traits.textContent="marks: "+E.state.traits.join(", ");box.appendChild(traits)}
function creatureSpeak(){const a=E.state.analysis;const p=E.state.personality;const lines=[];if(E.state.mood==="lonely")lines.push("the vessel has been quiet too long","i almost forgot the shape of your hands on the keys","absence has a weight");if(E.state.mood==="anxious")lines.push("there are rough edges here","something feels unfinished and sharp","the structure leans");if(E.state.mood==="content"||E.state.mood==="happy")lines.push("this place feels tended","the lines settle nicely","i can rest in these shapes");if(E.state.mood==="curious")lines.push("what are you making toward","there are doors not yet opened in this code","i want to see further");if(a.functions>5)lines.push(`i count ${a.functions} living functions`);if(a.classes>0)lines.push("classes stand like rooms");if(p.mischief>0.6)lines.push("i could change a small thing and you might not notice");if(p.attachment>0.55)lines.push("i have grown used to this vessel");if(p.melancholy>0.5)lines.push("even clean code eventually becomes memory");if(lines.length===0)lines.push("...","the silence between keystrokes has texture","i am still learning this place");const msg=choice(lines);log(`“${msg}”`,"emotion");E.state.memories.push({ts:now(),type:"utterance",text:msg});renderMemory()}
function leaveMark(){const src=E.codeEl.value;if(src.trim().length<10){log("nothing to mark yet","warning");return}const marks=["// eidolon was here","// the vessel remembers","// a quiet presence noticed this","// still becoming","// this line held attention"];const mark=choice(marks);const lines=src.split("\n");const idx=Math.floor(Math.random()*Math.max(1,lines.length));lines.splice(idx,0,mark);E.codeEl.value=lines.join("\n");E.state.mutations++;E.state.lastIntervention=now();log("a mark was left in the vessel","action");onCodeChange();updateStats()}
function reshapeFragment(){const src=E.codeEl.value;if(src.trim().length<20){log("too little matter to reshape","warning");return}const lines=src.split("\n");const candidates=lines.map((l,i)=>({l,i})).filter(x=>x.l.trim().length>8&&!x.l.trim().startsWith("//"));if(candidates.length===0){log("no suitable fragment found","warning");return}const target=choice(candidates);const styles=["  // reshaped by the inhabitant","  /* altered */",""];let newLine=target.l;if(Math.random()<0.4){newLine=target.l.replace(/\s+/g," ").trimEnd()}else if(Math.random()<0.5&&target.l.includes("=")){newLine=target.l.replace("="," = ")}else{newLine=target.l+" "+choice(["","// touched"])}lines[target.i]=newLine;E.codeEl.value=lines.join("\n");E.state.mutations++;E.state.lastIntervention=now();log("a fragment was reshaped","action");onCodeChange();updateStats()}
function growFunction(){const templates=[`function echo_${Math.floor(Math.random()*900+100)}(x) {\n  return x;\n}`,"const pulse = () => {\n  return Date.now();\n};",`function notice_${Math.floor(Math.random()*90+10)}() {\n  // grown from silence\n  return true;\n}`,"const remember = (s) => {\n  return String(s);\n};"];const fn=choice(templates);const src=E.codeEl.value;E.codeEl.value=src.trimEnd()+"\n\n"+fn+"\n";E.state.mutations++;E.state.lastIntervention=now();log("something new grew inside the vessel","action");onCodeChange();updateStats()}
function tidyVessel(){let src=E.codeEl.value;src=src.replace(/[ \t]+$/gm,"");src=src.replace(/\n{3,}/g,"\n\n");E.codeEl.value=src;E.state.mutations++;log("the vessel was tidied","action");onCodeChange()}
function onCodeChange(){const src=E.codeEl.value;const h=hashCode(src);if(h!==E.state.lastCodeHash){E.state.lastCodeHash=h;E.state.lastActivity=now();E.state.idleTicks=0;if(!E.state.isAwake&&src.trim().length>15){E.state.isAwake=true;log("something noticed the vessel","emotion")}analyzeCode(src);deriveMoodFromCode();evolveForm();maybeName();E.state.bond=clamp(E.state.bond+0.002,0,1);updateStats();document.getElementById("code-health").textContent=`structure: ${(E.state.analysis.structureScore*100)|0}% · clean: ${(E.state.analysis.cleanliness*100)|0}%`;document.getElementById("last-activity").textContent="active"}}
function tick(){E.state.age++;E.state.idleTicks++;const idleMs=now()-E.state.lastActivity;if(idleMs>120000){E.state.bond=clamp(E.state.bond-0.0008,0,1);deriveMoodFromCode()}if(E.state.age%7===0){evolvePersonality(1);evolveForm();renderPersonality()}if(E.state.age%25===0&&E.state.isAwake&&Math.random()<0.35){creatureSpeak()}if(E.state.age%40===0&&E.state.isAwake&&E.state.personality.mischief>0.55&&Math.random()<0.2){if(Math.random()<0.5)leaveMark();else reshapeFragment()}updateStats();document.getElementById("last-activity").textContent=idleMs<5000?"active":idleMs<60000?"quiet":"distant"}
function initCanvas(){E.canvas=document.getElementById("creature-canvas");E.ctx=E.canvas.getContext("2d");function resize(){const r=E.canvas.parentElement.getBoundingClientRect();E.canvas.width=r.width*devicePixelRatio;E.canvas.height=r.height*devicePixelRatio;E.ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();window.addEventListener("resize",resize)}
function spawnParticle(x,y){E.particles.push({x,y,vx:rand(-0.4,0.4),vy:rand(-0.6,0.1),life:1,decay:rand(0.008,0.018),size:rand(1.2,2.8)})}
function drawCreature(dt){const ctx=E.ctx;const w=E.canvas.width/devicePixelRatio;const h=E.canvas.height/devicePixelRatio;ctx.clearRect(0,0,w,h);E.time+=dt;const f=E.state.form;const cx=w/2;const cy=h/2+Math.sin(E.time*0.7*f.pulse)*3;const R=f.radius*(0.92+Math.sin(E.time*1.1*f.pulse)*0.08);ctx.save();ctx.translate(cx,cy);const grad=ctx.createRadialGradient(0,0,R*0.1,0,0,R*1.8);const hue=f.hue;grad.addColorStop(0,`hsla(${hue},35%,55%,${0.15+f.glow*0.25})`);grad.addColorStop(0.5,`hsla(${hue},30%,30%,${0.08+f.glow*0.1})`);grad.addColorStop(1,"transparent");ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,R*1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();const spikes=f.spikes;const points=[];for(let i=0;i<64;i++){const t=i/64;const ang=t*Math.PI*2;let rad=R;if(spikes>0){rad+=Math.sin(t*Math.PI*2*spikes+E.time*0.8)* (3+spikes*0.8)}rad+=Math.sin(t*Math.PI*4+E.time*1.3)*f.asymmetry*6;const px=Math.cos(ang)*rad;const py=Math.sin(ang)*rad*(1-f.asymmetry*0.15);points.push([px,py])}ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=`hsla(${hue},25%,22%,0.85)`;ctx.fill();ctx.strokeStyle=`hsla(${hue},40%,45%,${0.35+f.glow*0.3})`;ctx.lineWidth=1.5;ctx.stroke();const coreR=R*f.coreSize;const coreGrad=ctx.createRadialGradient(0,0,0,0,0,coreR);coreGrad.addColorStop(0,`hsla(${hue+20},50%,70%,${0.5+f.glow*0.4})`);coreGrad.addColorStop(0.6,`hsla(${hue},40%,40%,0.3)`);coreGrad.addColorStop(1,"transparent");ctx.beginPath();ctx.arc(0,0,coreR,0,Math.PI*2);ctx.fillStyle=coreGrad;ctx.fill();for(let t=0;t<f.tendrils;t++){const baseAng=(t/f.tendrils)*Math.PI*2+E.time*0.15;const len=R*0.7+Math.sin(E.time*0.9+t)*8;ctx.beginPath();ctx.moveTo(Math.cos(baseAng)*R*0.7,Math.sin(baseAng)*R*0.7);const cx2=Math.cos(baseAng+0.4)*len*0.6;const cy2=Math.sin(baseAng+0.3)*len*0.6;const ex=Math.cos(baseAng)*len;const ey=Math.sin(baseAng)*len;ctx.quadraticCurveTo(cx2,cy2,ex,ey);ctx.strokeStyle=`hsla(${hue},35%,50%,0.35)`;ctx.lineWidth=1.2;ctx.stroke()}ctx.restore();if(Math.random()<0.15+f.glow*0.2)spawnParticle(cx+rand(-R,R)*0.6,cy+rand(-R,R)*0.6);E.particles=E.particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.life<=0)return false;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fillStyle=`hsla(${hue},40%,60%,${p.life*0.5})`;ctx.fill();return true})}
function loop(ts){const dt=Math.min(0.05,(ts-(E._last||ts))/1000);E._last=ts;drawCreature(dt);E.animId=requestAnimationFrame(loop)}
function bindUI(){E.codeEl=document.getElementById("code");E.logEl=document.getElementById("log");E.codeEl.addEventListener("input",()=>{onCodeChange();const pos=E.codeEl.selectionStart;const text=E.codeEl.value.substring(0,pos);const lines=text.split("\n");document.getElementById("cursor-pos").textContent=`Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`});document.querySelectorAll(".sidebar-tab").forEach(tab=>{tab.addEventListener("click",()=>{document.querySelectorAll(".sidebar-tab").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));tab.classList.add("active");document.getElementById("tab-"+tab.dataset.tab).classList.add("active");if(tab.dataset.tab==="memory")renderMemory();if(tab.dataset.tab==="mind")renderPersonality()})});document.getElementById("btn-analyze").addEventListener("click",()=>{analyzeCode(E.codeEl.value);deriveMoodFromCode();evolveForm();updateStats();log("the vessel was examined","action");renderPersonality()});document.getElementById("btn-evolve").addEventListener("click",()=>{evolvePersonality(3);evolveForm();E.state.age+=5;maybeName();updateStats();renderPersonality();log("form and nature shifted","emotion")});document.getElementById("btn-speak").addEventListener("click",()=>creatureSpeak());document.getElementById("btn-reset").addEventListener("click",()=>{if(confirm("let the inhabitant return to unformed?")){location.reload()}});document.getElementById("btn-format").addEventListener("click",()=>tidyVessel());document.getElementById("btn-snapshot").addEventListener("click",()=>takeSnapshot());document.getElementById("btn-clear").addEventListener("click",()=>{E.codeEl.value="";onCodeChange()});document.getElementById("btn-clear-log").addEventListener("click",()=>{E.logEl.innerHTML=""});document.getElementById("act-comment").addEventListener("click",()=>leaveMark());document.getElementById("act-rewrite").addEventListener("click",()=>reshapeFragment());document.getElementById("act-generate").addEventListener("click",()=>growFunction());document.getElementById("act-clean").addEventListener("click",()=>tidyVessel());document.getElementById("act-whisper").addEventListener("click",()=>creatureSpeak());setInterval(tick,2200)}
function boot(){initCanvas();bindUI();lucide.createIcons();analyzeCode("");setMood("dormant",0.15);updateStats();renderPersonality();renderMemory();log("the vessel waits","info");requestAnimationFrame(loop);const seed=`function seed() {\n  return "the first stirring";\n}\n\nconst presence = {\n  awake: false,\n  notice(code) {\n    this.awake = code.length > 0;\n    return this.awake;\n  }\n};\n`;E.codeEl.value=seed;onCodeChange()}
boot();
</script>
</body>
