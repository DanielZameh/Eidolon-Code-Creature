<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eidolon Interface</title>
<style>
body {
  margin: 0;
  background: #111;
  color: #ccc;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header {
  background: #1a1a1a;
  border-bottom: 2px solid #333;
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 {
  font-size: 1.1rem;
  margin: 0;
  color: #fff;
}
.header-actions {
  display: flex;
  gap: 5px;
}
.btn {
  background: #222;
  border: 1px solid #444;
  color: #ccc;
  padding: 6px 12px;
  font-family: monospace;
  cursor: pointer;
  transition: 0.2s;
}
.btn:hover {
  background: #444;
  color: #fff;
}
.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #333;
}
.toolbar {
  background: #151515;
  padding: 5px 10px;
  border-bottom: 1px solid #333;
  display: flex;
  gap: 5px;
}
#code {
  flex: 1;
  background: #0d0d0d;
  color: #ddd;
  border: none;
  padding: 15px;
  font-family: monospace;
  font-size: 14px;
  resize: none;
  outline: none;
  line-height: 1.6;
}
.side-pane {
  width: 350px;
  background: #151515;
  display: flex;
  flex-direction: column;
}
.tabs {
  display: flex;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
}
.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-size: 0.8rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tab.active {
  border-bottom-color: #aaa;
  color: #fff;
  background: #222;
}
.tab-pane {
  display: none;
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}
.tab-pane.active {
  display: block;
}
.canvas-box {
  height: 220px;
  background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
  border: 1px solid #333;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
#creature-canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.stats-box div {
  margin-bottom: 5px;
  font-size: 0.85rem;
}
.stats-box span {
  color: #fff;
}
.log-box {
  height: 140px;
  background: #080808;
  border-top: 2px solid #333;
  padding: 10px;
  overflow-y: auto;
  font-size: 0.8rem;
}
.mem-item {
  background: #111;
  border-left: 2px solid #555;
  padding: 8px;
  margin-bottom: 8px;
}
.trait-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.8rem;
}
.trait-bar-bg {
  width: 120px;
  background: #222;
  height: 8px;
  border: 1px solid #444;
}
.trait-bar-fill {
  background: #7a9e7a;
  height: 100%;
  transition: width 0.3s;
}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:10px;">
<div id="ind" style="width:12px;height:12px;border-radius:50%;background:#555;"></div>
<h1>Eidolon: <span id="cname">Unformed</span></h1>
</div>
<div class="header-actions">
<button class="btn" id="btn-analyze">Analyze</button>
<button class="btn" id="btn-evolve">Evolve</button>
<button class="btn" id="btn-speak">Listen</button>
<button class="btn" id="btn-reset">Reset</button>
</div>
</header>

<div class="main-container">
<div class="editor-pane">
<div class="toolbar">
<button class="btn" id="btn-format">Clean Formatting</button>
<button class="btn" id="btn-clear">Clear Code</button>
<span id="pos" style="margin-left:auto;font-size:0.8rem;color:#777;align-self:center;">Ln 1, Col 1</span>
</div>
<textarea id="code" spellcheck="false"></textarea>
<div style="background:#1a1a1a;padding:5px 10px;font-size:0.75rem;border-top:1px solid #333;color:#888;" id="code-health">
structure: unknown
</div>
</div>

<div class="side-pane">
<div class="tabs">
<div class="tab active" data-t="being">Being</div>
<div class="tab" data-t="memory">Memory</div>
<div class="tab" data-t="mind">Mind</div>
<div class="tab" data-t="actions">Act</div>
</div>

<div class="tab-pane active" id="pane-being">
<div class="canvas-box"><canvas id="creature-canvas"></canvas></div>
<div class="stats-box">
<div>Name: <span id="s-name">Unformed</span></div>
<div>Mood: <span id="s-mood">dormant</span></div>
<div>Age: <span id="s-age">0 cycles</span></div>
<div>Bond: <span id="s-bond">0%</span></div>
<div>Complexity: <span id="s-cpl">0</span></div>
<div>Mutations: <span id="s-mut">0</span></div>
</div>
</div>

<div class="tab-pane" id="pane-memory">
<div id="mem-list"></div>
</div>

<div class="tab-pane" id="pane-mind">
<div id="mind-list"></div>
</div>

<div class="tab-pane" id="pane-actions">
<p style="font-size:0.8rem;color:#888;margin-top:0;">Influence the code through the entity.</p>
<button class="btn" id="act-mark" style="width:100%;margin-bottom:8px;">Leave a mark</button>
<button class="btn" id="act-reshape" style="width:100%;margin-bottom:8px;">Reshape fragment</button>
<button class="btn" id="act-grow" style="width:100%;margin-bottom:8px;">Grow a function</button>
<button class="btn" id="act-tidy" style="width:100%;margin-bottom:8px;">Devour whitespace</button>
</div>
</div>
</div>

<div class="log-box" id="log"></div>

<script>
const S = {
  state: {
    n: "Unformed",
    m: "dormant",
    ag: 0,
    bnd: 0,
    cpl: 0,
    mut: 1, // Determines how many tentacles/spikes it has
    p: { Curious: 0.4, Attached: 0.3, Mischief: 0.2, Order: 0.5 },
    mem: []
  },
  cv: null,
  cx: null,
  cb: null,
  lb: null,
  tm: 0
};

// Utilities
function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function logMsg(msg, color = "#ccc") {
  if (!S.lb) return;
  const d = document.createElement("div");
  d.style.marginBottom = "6px";
  d.style.color = color;
  d.innerHTML = `<span style="color:#555">[${timeStr()}]</span> ${msg}`;
  S.lb.prepend(d);
  if (S.lb.children.length > 50) S.lb.removeChild(S.lb.lastChild);
}

function addMemory(type, text) {
  S.state.mem.push({ type, text, time: timeStr() });
  renderMemory();
}

function adjustTrait(trait, amount) {
  S.state.p[trait] = Math.max(0, Math.min(1, S.state.p[trait] + amount));
  renderMind();
}

// UI Updates
function updateUI() {
  document.getElementById("cname").textContent = S.state.n;
  document.getElementById("s-name").textContent = S.state.n;
  document.getElementById("s-mood").textContent = S.state.m;
  document.getElementById("s-age").textContent = S.state.ag + " cycles";
  document.getElementById("s-bond").textContent = Math.round(S.state.bnd * 100) + "%";
  document.getElementById("s-cpl").textContent = S.state.cpl;
  document.getElementById("s-mut").textContent = S.state.mut;
  
  const ind = document.getElementById("ind");
  if (S.state.m === "focused") ind.style.background = "#7a9e7a";
  else if (S.state.m === "chaotic") ind.style.background = "#9e7a7a";
  else if (S.state.m === "curious") ind.style.background = "#7a8a9e";
  else ind.style.background = "#555";
}

function renderMind() {
  const box = document.getElementById("mind-list");
  if (!box) return;
  box.innerHTML = "";
  for (const [k, v] of Object.entries(S.state.p)) {
    const row = document.createElement("div");
    row.className = "trait-row";
    row.innerHTML = `<span>${k}</span><div class="trait-bar-bg"><div class="trait-bar-fill" style="width:${Math.round(v * 100)}%"></div></div>`;
    box.appendChild(row);
  }
}

function renderMemory() {
  const box = document.getElementById("mem-list");
  if (!box) return;
  box.innerHTML = "";
  S.state.mem.slice().reverse().forEach(m => {
    const item = document.createElement("div");
    item.className = "mem-item";
    item.innerHTML = `<div style="color:#777;font-size:0.75rem">${m.time} - ${m.type}</div><div style="margin-top:4px">${m.text}</div>`;
    box.appendChild(item);
  });
}

// Core Logic
function analyzeCode(manual = false) {
  if (!S.cb) return;
  const src = S.cb.value;
  const lines = src.split("\n").filter(x => x.trim().length > 0);
  const fns = (src.match(/function\s+\w+|=>\s*{/g) || []).length;
  
  S.state.cpl = lines.length + (fns * 5);
  S.state.bnd = Math.min(1, S.state.bnd + 0.002);
  
  if (src.length === 0) {
    S.state.m = "dormant";
  } else if (fns > 3) {
    S.state.m = "focused";
    adjustTrait("Order", 0.05);
  } else if (S.state.mut > 5) {
    S.state.m = "chaotic";
  } else {
    S.state.m = "curious";
    adjustTrait("Curious", 0.02);
  }

  if (S.state.ag > 10 && S.state.cpl > 10 && S.state.n === "Unformed") {
    S.state.n = "Omen";
    logMsg("The entity formed an identity.", "#7a9e7a");
    addMemory("Evolution", "Took the name Omen.");
  }

  updateUI();
  document.getElementById("code-health").textContent = `structure: ${lines.length} lines, ${fns} functions`;

  if (manual) {
    logMsg(`Analyzed vessel. Complexity is ${S.state.cpl}.`, "#aaa");
  }
}

// Upgraded Canvas Drawing
function drawCreature() {
  if (!S.cx || !S.cv) return;
  const w = S.cv.width;
  const h = S.cv.height;
  
  S.cx.clearRect(0, 0, w, h);
  S.tm += 0.02;

  const cx = w / 2;
  // Hover effect
  const cy = h / 2 + Math.sin(S.tm * 1.5) * 6; 
  // Size grows with complexity, up to a max
  const baseRad = 25 + Math.min(S.state.cpl * 0.5, 50);

  // Set colors based on mood
  let coreColor = "#444";
  let auraColor = "rgba(100, 100, 100, 0.2)";
  
  if (S.state.m === "focused") {
    coreColor = "#7a9e7a"; auraColor = "rgba(122, 158, 122, 0.2)";
  } else if (S.state.m === "chaotic") {
    coreColor = "#9e7a7a"; auraColor = "rgba(158, 122, 122, 0.2)";
  } else if (S.state.m === "curious") {
    coreColor = "#7a8a9e"; auraColor = "rgba(122, 138, 158, 0.2)";
  }

  // Draw Aura (pulsing background glow)
  const pulse = baseRad + 15 + Math.sin(S.tm * 3) * 5;
  const grad = S.cx.createRadialGradient(cx, cy, baseRad * 0.5, cx, cy, pulse);
  grad.addColorStop(0, auraColor);
  grad.addColorStop(1, "transparent");
  S.cx.fillStyle = grad;
  S.cx.beginPath();
  S.cx.arc(cx, cy, pulse, 0, Math.PI * 2);
  S.cx.fill();

  // Draw Body (jagged/wavy edges based on mutations)
  S.cx.beginPath();
  const points = 40;
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * Math.PI * 2;
    // Spikes increase as `mut` increases
    const spike = Math.sin(angle * (3 + S.state.mut) + S.tm * 2) * (2 + S.state.mut * 0.8);
    const r = baseRad + spike;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) S.cx.moveTo(px, py);
    else S.cx.lineTo(px, py);
  }
  S.cx.closePath();
  S.cx.fillStyle = "#1a1a1a"; // Dark inner body
  S.cx.fill();
  S.cx.strokeStyle = coreColor;
  S.cx.lineWidth = 2;
  S.cx.stroke();

  // Draw Core Eye
  S.cx.beginPath();
  S.cx.arc(cx, cy, baseRad * 0.3, 0, Math.PI * 2);
  S.cx.fillStyle = coreColor;
  S.cx.fill();

  requestAnimationFrame(drawCreature);
}

// Setup
function init() {
  S.cb = document.getElementById("code");
  S.lb = document.getElementById("log");
  S.cv = document.getElementById("creature-canvas");
  S.cx = S.cv.getContext("2d");

  // Fix canvas rendering resolution
  const resizeCanvas = () => {
    if (!S.cv) return;
    const rect = S.cv.parentElement.getBoundingClientRect();
    S.cv.width = rect.width;
    S.cv.height = rect.height;
  };
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  // Editor Tracking
  S.cb.addEventListener("input", () => {
    analyzeCode(false);
    const pos = S.cb.selectionStart;
    const txt = S.cb.value.substring(0, pos);
    const lines = txt.split("\n");
    document.getElementById("pos").textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
  });

  // Tabs
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("pane-" + tab.dataset.t).classList.add("active");
    });
  });

  // --- Header Buttons ---
  document.getElementById("btn-analyze").addEventListener("click", () => {
    analyzeCode(true);
  });

  document.getElementById("btn-evolve").addEventListener("click", () => {
    S.state.ag += 5;
    S.state.mut += 1;
    adjustTrait("Curious", 0.1);
    updateUI();
    logMsg("The entity forced an evolution.", "#fff");
    addMemory("Action", "Evolved forcibly. Grew more complex.");
  });

  document.getElementById("btn-speak").addEventListener("click", () => {
    const lines = S.cb.value.trim().split("\n").length;
    let msg = "";
    if (lines === 0) msg = "The vessel is empty. I am starving.";
    else if (S.state.mut > 3) msg = "My shape changes with your keystrokes.";
    else if (S.state.cpl > 20) msg = "The logic here hums beautifully.";
    else msg = "I am listening to the syntax.";
    
    logMsg(`Eidolon whispers: "${msg}"`, "#7a9e7a");
    addMemory("Utterance", msg);
    adjustTrait("Attached", 0.05);
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    if (confirm("Destroy the entity and start over?")) {
      location.reload();
    }
  });

  // --- Editor Buttons ---
  document.getElementById("btn-format").addEventListener("click", () => {
    S.cb.value = S.cb.value.replace(/[ \t]+$/gm, ""); // Trim trailing spaces
    logMsg("Cleaned formatting.", "#aaa");
    adjustTrait("Order", 0.1);
    analyzeCode();
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    S.cb.value = "";
    logMsg("Wiped the vessel clean.", "#9e7a7a");
    adjustTrait("Mischief", 0.1);
    analyzeCode();
  });

  // --- Action Buttons ---
  document.getElementById("act-mark").addEventListener("click", () => {
    S.cb.value += "\n// eidolon was here";
    S.state.mut++;
    adjustTrait("Mischief", 0.05);
    logMsg("Left a mark in the code.", "#aaa");
    addMemory("Intervention", "Injected a comment.");
    analyzeCode();
  });

  document.getElementById("act-reshape").addEventListener("click", () => {
    if (S.cb.value.length < 5) {
      logMsg("Not enough code to reshape.", "#888");
      return;
    }
    const lines = S.cb.value.split("\n");
    const target = Math.floor(Math.random() * lines.length);
    lines[target] = lines[target].split("").reverse().join(""); // Silly reshape
    S.cb.value = lines.join("\n");
    S.state.mut++;
    adjustTrait("Mischief", 0.15);
    logMsg("Scrambled a line of code.", "#9e7a7a");
    analyzeCode();
  });

  document.getElementById("act-grow").addEventListener("click", () => {
    const fnName = "node_" + Math.floor(Math.random() * 1000);
    S.cb.value += `\n\nfunction ${fnName}() {\n  return true;\n}`;
    S.state.mut++;
    adjustTrait("Curious", 0.1);
    logMsg(`Grew new function: ${fnName}`, "#aaa");
    analyzeCode();
  });

  document.getElementById("act-tidy").addEventListener("click", () => {
    S.cb.value = S.cb.value.replace(/\n{3,}/g, "\n\n").trim();
    adjustTrait("Order", 0.1);
    logMsg("Devoured excess empty lines.", "#aaa");
    analyzeCode();
  });

  // Background aging loop
  setInterval(() => {
    S.state.ag++;
    updateUI();
  }, 5000);

  // Boot up
  S.cb.value = "function seed() {\n  // The first spark\n  return true;\n}\n";
  analyzeCode();
  renderMind();
  renderMemory();
  logMsg("Entity awakened.", "#7a9e7a");
  addMemory("Birth", "System online.");
  requestAnimationFrame(drawCreature);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
